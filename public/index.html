<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ownWk | Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Emoji Picker Library -->
    <script src="https://cdn.jsdelivr.net/npm/picmo@latest/dist/umd/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@picmo/popup-picker@latest/dist/umd/index.js"></script>
    <style>
        :root {
            --discord-dark: #313338;
            --discord-darker: #2b2d31;
            --discord-darkest: #1e1f22;
            --discord-sidebar: #232428;
            --discord-text: #dbdee1;
            --discord-muted: #949ba4;
            --discord-blue: #5865f2;
            --discord-green: #23a559;
            --discord-header: #ffffff;
            --discord-item-hover: #35373c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        body { background-color: var(--discord-darkest); color: var(--discord-text); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar - Server List */
        .guilds-sidebar { width: 72px; background-color: var(--discord-darkest); display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 8px; border-right: 1px solid rgba(255,255,255,0.05); }
        .guild-icon { width: 48px; height: 48px; border-radius: 50%; background-color: var(--discord-dark); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; position: relative; }
        .guild-icon:hover { border-radius: 30%; background-color: var(--discord-blue); color: white; }
        .guild-icon.active { border-radius: 30%; background-color: var(--discord-blue); }
        .guild-icon i { font-size: 20px; }
        .guild-separator { width: 32px; height: 2px; background-color: var(--discord-dark); border-radius: 1px; }

        /* Sidebar - Channel List */
        .channels-sidebar { width: 240px; background-color: var(--discord-sidebar); display: flex; flex-direction: column; }
        .server-header { height: 48px; padding: 0 16px; display: flex; align-items: center; box-shadow: 0 1px 0 rgba(0,0,0,0.2); font-weight: bold; cursor: pointer; transition: 0.2s; }
        .server-header:hover { background-color: rgba(255,255,255,0.05); }
        .channel-list { padding: 8px; flex: 1; overflow-y: auto; }
        .channel-category { padding: 18px 8px 4px 16px; font-size: 12px; font-weight: bold; color: var(--discord-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .channel-item { height: 34px; padding: 0 8px; border-radius: 4px; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: 0.2s; color: var(--discord-muted); margin-bottom: 2px; }
        .channel-item:hover { background-color: rgba(255,255,255,0.05); color: var(--discord-text); }
        .channel-item.active { background-color: rgba(255,255,255,0.1); color: white; }
        .channel-item i { font-size: 18px; opacity: 0.6; }

        /* User Info (Bottom of Sidebar) */
        .user-panel { height: 52px; background-color: #232428; padding: 0 8px; display: flex; align-items: center; gap: 8px; border-top: 1px solid rgba(255,255,255,0.05); }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; background-color: var(--discord-blue); position: relative; }
        .user-avatar::after { content: ''; position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; border-radius: 50%; background-color: var(--discord-green); border: 2px solid #232428; }
        .user-details { flex: 1; min-width: 0; }
        .username { font-size: 14px; font-weight: bold; color: white; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .user-status { font-size: 12px; color: var(--discord-muted); }

        /* Main Chat Area */
        .chat-container { flex: 1; display: flex; flex-direction: column; background-color: var(--discord-dark); }
        .chat-header { height: 48px; padding: 0 16px; display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 0 rgba(0,0,0,0.2); }
        .chat-header i { color: var(--discord-muted); font-size: 20px; }
        .chat-header h2 { font-size: 16px; color: white; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 16px 0; }

        /* Message Styling */
        .message { padding: 2px 16px; margin-top: 1.0625rem; display: flex; gap: 16px; }
        .message:hover { background-color: rgba(0,0,0,0.05); }
        .msg-avatar { width: 40px; height: 40px; border-radius: 50%; background-color: var(--discord-blue); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
        .msg-content { flex: 1; min-width: 0; }
        .msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .msg-author { font-weight: 500; color: white; cursor: pointer; }
        .msg-author:hover { text-decoration: underline; }
        .msg-timestamp { font-size: 12px; color: var(--discord-muted); }
        .msg-text { color: var(--discord-text); line-height: 1.375rem; white-space: pre-wrap; word-break: break-all; }
        
        /* Attachment/Embed Styling */
        .attachment { margin-top: 8px; background-color: var(--discord-darker); border: 1px solid rgba(255,255,255,0.05); border-radius: 4px; padding: 12px; display: flex; align-items: center; gap: 12px; max-width: 400px; }
        .file-icon { font-size: 24px; color: var(--discord-muted); }
        .file-info { flex: 1; min-width: 0; }
        .file-name { color: var(--discord-blue); font-weight: 500; cursor: pointer; text-decoration: none; display: block; overflow: hidden; text-overflow: ellipsis; }
        .file-name:hover { text-decoration: underline; }
        .file-size { font-size: 12px; color: var(--discord-muted); }
        .download-btn { color: var(--discord-muted); cursor: pointer; transition: 0.2s; }
        .download-btn:hover { color: white; }

        /* Media Previews */
        .media-preview { margin-top: 8px; border-radius: 8px; overflow: hidden; max-width: 400px; border: 1px solid rgba(255,255,255,0.05); }
        .media-preview img, .media-preview video { width: 100%; display: block; }

        /* Webhook Info Card (Top of chat) */
        .webhook-welcome { padding: 16px; margin: 16px; background-color: var(--discord-darker); border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .webhook-welcome h1 { font-size: 24px; color: white; margin-bottom: 8px; }
        .webhook-welcome p { color: var(--discord-muted); font-size: 14px; margin-bottom: 12px; }
        .endpoint-box { background: var(--discord-darkest); padding: 8px 12px; border-radius: 4px; font-family: monospace; font-size: 13px; color: var(--discord-green); display: flex; justify-content: space-between; align-items: center; }
        .copy-btn { cursor: pointer; color: var(--discord-muted); }
        .copy-btn:hover { color: white; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--discord-darkest); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #1a1b1e; }

        /* Message Input Area */
        .chat-input-container {
            padding: 0 16px 24px 16px;
            background-color: var(--discord-dark);
        }
        .chat-input-wrapper {
            background-color: #383a40;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            height: 44px;
        }
        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--discord-text);
            font-size: 16px;
            outline: none;
        }
        .chat-input::placeholder {
            color: var(--discord-muted);
        }
        .chat-input-icons {
            display: flex;
            gap: 16px;
            color: var(--discord-muted);
            font-size: 20px;
        }
        .chat-input-icons i {
            cursor: pointer;
            transition: 0.2s;
        }
        .chat-input-icons i:hover {
            color: var(--discord-text);
        }

        /* Upload Menu */
        .upload-menu {
            position: absolute;
            bottom: 80px;
            left: 16px;
            background-color: #111214;
            border-radius: 8px;
            padding: 8px;
            display: none;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            z-index: 1000;
            width: 200px;
        }
        .upload-menu-item {
            padding: 8px 12px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            color: var(--discord-text);
            font-size: 14px;
        }
        .upload-menu-item:hover {
            background-color: var(--discord-blue);
            color: white;
        }
        .upload-menu-item i {
            width: 16px;
            text-align: center;
            opacity: 0.7;
        }

        /* Emoji Picker Styling */
        .picker-container {
            position: absolute;
            bottom: 80px;
            right: 16px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <!-- Guilds Sidebar -->
    <div class="guilds-sidebar">
        <div class="guild-icon active">
            <i class="fa-solid fa-house"></i>
        </div>
        <div class="guild-separator"></div>
        <div class="guild-icon">
            <i class="fa-solid fa-plus"></i>
        </div>
    </div>

    <!-- Channels Sidebar -->
    <div class="channels-sidebar">
        <div class="server-header">
            ownWk Receiver
        </div>
        <div class="channel-list">
            <div class="channel-category">Webhook Channel</div>
            <div class="channel-item active">
                <i class="fa-solid fa-hashtag"></i>
                <span>incoming-data</span>
            </div>
        </div>
        <div class="user-panel">
            <div class="user-avatar"></div>
            <div class="user-details">
                <div class="username">Admin</div>
                <div class="user-status">v2.0 Live</div>
            </div>
            <i class="fa-solid fa-gear" style="cursor: pointer; opacity: 0.6;"></i>
        </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-container">
        <div class="chat-header">
            <i class="fa-solid fa-hashtag"></i>
            <h2>incoming-data</h2>
        </div>
        <div class="chat-messages" id="webhook-list">
            <!-- Messages will be injected here -->
        </div>
        <!-- Chat Input Area -->
        <div class="chat-input-container">
            <div class="upload-menu" id="upload-menu">
                <div class="upload-menu-item" onclick="triggerFileUpload()">
                    <i class="fa-solid fa-file-arrow-up"></i>
                    <span>Datei hochladen</span>
                </div>
                <div class="upload-menu-item">
                    <i class="fa-solid fa-square-poll-horizontal"></i>
                    <span>Umfrage erstellen</span>
                </div>
                <div class="upload-menu-item">
                    <i class="fa-solid fa-shapes"></i>
                    <span>Verwende Apps</span>
                </div>
            </div>
            <div id="emoji-picker-container" class="picker-container"></div>
            
            <div class="chat-input-wrapper">
                <i class="fa-solid fa-circle-plus" id="upload-btn" style="margin-right: 16px; color: var(--discord-muted); cursor: pointer; font-size: 20px;"></i>
                <input type="text" class="chat-input" id="message-input" placeholder="Message #incoming-data">
                <input type="file" id="hidden-file-input" style="display: none;" onchange="handleManualUpload(this)">
                <div class="chat-input-icons">
                    <i class="fa-solid fa-gift"></i>
                    <i class="fa-solid fa-bolt"></i>
                    <i class="fa-solid fa-note-sticky"></i>
                    <i class="fa-solid fa-face-smile" id="emoji-btn"></i>
                    <i class="fa-solid fa-square-plus"></i>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin + '/api'; 
        
        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                alert('Copied to clipboard!');
            } catch (err) {
                console.error('Failed to copy: ', err);
            }
        }

        async function loadWebhooks() {
            const listDiv = document.getElementById('webhook-list');
            if (!listDiv) {
                console.error("Critical: 'webhook-list' element not found!");
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/list`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                
                let combinedFeed = [];

                if (data.webhooks) {
                    data.webhooks.forEach(webhook => {
                        let content = webhook.body;
                        let author = 'Webhook';
                        let isChat = false;

                        try {
                            const parsed = JSON.parse(webhook.body);
                            if (parsed.type === 'chat_message') {
                                content = parsed.content;
                                author = parsed.author || 'Admin';
                                isChat = true;
                            }
                        } catch (e) {}

                        combinedFeed.push({
                            type: isChat ? 'chat' : 'webhook',
                            timestamp: webhook.timestamp,
                            content: content,
                            author: author,
                            headers: typeof webhook.headers === 'string' ? JSON.parse(webhook.headers) : webhook.headers
                        });
                    });
                }

                if (data.uploads) {
                    data.uploads.forEach(upload => {
                        combinedFeed.push({
                            type: 'upload',
                            timestamp: upload.time,
                            name: upload.name,
                            size: upload.size,
                            path: upload.path,
                            author: 'File Bot',
                            headers: typeof upload.headers === 'string' ? JSON.parse(upload.headers) : upload.headers
                        });
                    });
                }

                // Sort oldest to newest
                combinedFeed.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

                // Always start with welcome message
                let html = `
                    <div class="webhook-welcome">
                        <h1>Welcome to #incoming-data</h1>
                        <p>This is your private receiver. Any data sent to your webhook link will appear here instantly.</p>
                        <div class="endpoint-box">
                            <span id="webhook-url">${window.location.origin}/api/webhook</span>
                            <i class="fa-solid fa-copy copy-btn" onclick="copyToClipboard('${window.location.origin}/api/webhook')"></i>
                        </div>
                    </div>
                `;

                combinedFeed.forEach(item => {
                    const timestamp = new Date(item.timestamp);
                    const timeString = timestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const dateString = timestamp.toLocaleDateString();
                    
                    let contentHtml = '';
                    let authorName = item.author || 'Webhook';
                    let avatarInitial = authorName[0].toUpperCase();
                    let avatarColor = '#5865f2';
                    const ip = item.headers ? (item.headers.ip || '') : '';
                    const displayAuthor = ip ? `${authorName} [${ip}]` : authorName;

                    if (item.type === 'chat') {
                        avatarColor = '#5865f2';
                        contentHtml = `<div class="msg-text">${item.content}</div>`;
                    } else if (item.type === 'webhook') {
                        avatarColor = '#23a559';
                        contentHtml = `<div class="msg-text"><pre style="background: rgba(0,0,0,0.2); border: none; padding: 8px; border-radius: 4px; overflow-x: auto;">${item.content}</pre></div>`;
                    } else if (item.type === 'upload') {
                        avatarColor = '#f57731';
                        const isArchive = item.name.endsWith('.zip') || item.name.endsWith('.rar') || item.name.endsWith('.7z');
                        const isImage = item.name.match(/\.(jpg|jpeg|png|gif|webp)$/i);
                        const isVideo = item.name.match(/\.(mp4|webm|mov)$/i);
                        const iconClass = isArchive ? 'fa-file-archive' : 'fa-file';
                        
                        let mediaHtml = '';
                        if (isImage) {
                            mediaHtml = `<div class="media-preview"><img src="${item.path}" style="max-width: 100%; border-radius: 4px; margin-top: 8px;"></div>`;
                        } else if (isVideo) {
                            mediaHtml = `<div class="media-preview"><video src="${item.path}" controls style="max-width: 100%; border-radius: 4px; margin-top: 8px;"></video></div>`;
                        }

                        contentHtml = `
                            <div class="msg-text">Sent an attachment:</div>
                            <div class="attachment">
                                <i class="fa-solid ${iconClass} file-icon"></i>
                                <div class="file-info">
                                    <a href="${item.path}" target="_blank" class="file-name">${item.name}</a>
                                    <div class="file-size">${(item.size / 1024).toFixed(2)} KB</div>
                                </div>
                                <a href="${item.path}" download="${item.name}" class="download-btn">
                                    <i class="fa-solid fa-download"></i>
                                </a>
                            </div>
                            ${mediaHtml}
                        `;
                    }

                    html += `
                        <div class="message">
                            <div class="msg-avatar" style="background-color: ${avatarColor}">${avatarInitial}</div>
                            <div class="msg-content">
                                <div class="msg-header">
                                    <span class="msg-author">${displayAuthor}</span>
                                    <span class="msg-timestamp">${dateString} at ${timeString}</span>
                                </div>
                                ${contentHtml}
                            </div>
                        </div>
                    `;
                });

                listDiv.innerHTML = html;
                listDiv.scrollTop = listDiv.scrollHeight;

            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        window.onload = () => {
            loadWebhooks();
            setInterval(loadWebhooks, 5000); // Live refresh

            // Add listener for message input
            const messageInput = document.getElementById('message-input');
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // --- Upload Menu Toggle ---
            const uploadBtn = document.getElementById('upload-btn');
            const uploadMenu = document.getElementById('upload-menu');
            uploadBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                uploadMenu.style.display = uploadMenu.style.display === 'flex' ? 'none' : 'flex';
            });

            // --- Emoji Picker ---
            const emojiBtn = document.getElementById('emoji-btn');
            const pickerContainer = document.getElementById('emoji-picker-container');
            
            // Using Picmo Emoji Picker
            const picker = picmo.createPicker({
                rootElement: pickerContainer
            });

            pickerContainer.style.display = 'none';

            emojiBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                pickerContainer.style.display = pickerContainer.style.display === 'none' ? 'block' : 'none';
            });

            picker.addEventListener('emoji:select', (event) => {
                messageInput.value += event.emoji;
                pickerContainer.style.display = 'none';
                messageInput.focus();
            });

            // Close menus on click outside
            document.addEventListener('click', () => {
                uploadMenu.style.display = 'none';
                pickerContainer.style.display = 'none';
            });
        };

        function triggerFileUpload() {
            document.getElementById('hidden-file-input').click();
        }

        async function handleManualUpload(input) {
            if (input.files.length === 0) return;
            
            const file = input.files[0];
            const formData = new FormData();
            formData.append('file', file);

            try {
                // We reuse our webhook endpoint for manual uploads too
                const response = await fetch(`${API_BASE_URL}/webhook`, {
                    method: 'POST',
                    headers: {
                        'X-File-Name': file.name
                    },
                    body: file // Send as direct stream for our refined logic
                });

                if (response.ok) {
                    loadWebhooks();
                }
            } catch (error) {
                console.error('Upload error:', error);
            }
            input.value = ''; // Reset
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (!message) return;

            // 1. Sofort leeren für das Discord-Feeling
            input.value = '';
            input.focus();

            try {
                const response = await fetch(`${API_BASE_URL}/webhook`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        type: 'chat_message',
                        content: message,
                        author: 'Admin'
                    })
                });

                if (response.ok) {
                    // 2. Liste im Hintergrund aktualisieren
                    await loadWebhooks();
                } else {
                    console.error('Failed to send message');
                    // Optional: Nachricht wieder einsetzen bei Fehler
                    // input.value = message;
                }
            } catch (error) {
                console.error('Error sending message:', error);
            }
        }
    </script>
</body>
</html>
