<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord | Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/picmo@latest/dist/umd/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@picmo/popup-picker@latest/dist/umd/index.js"></script>
    <style>
        :root {
            --discord-dark: #313338;
            --discord-darker: #2b2d31;
            --discord-darkest: #1e1f22;
            --discord-sidebar: #232428;
            --discord-text: #dbdee1;
            --discord-muted: #949ba4;
            --discord-blue: #5865f2;
            --discord-green: #23a559;
            --discord-header: #ffffff;
            --discord-input: #383a40;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        body { background-color: var(--discord-darkest); color: var(--discord-text); display: flex; height: 100vh; overflow: hidden; }

        .guilds-sidebar { width: 72px; background-color: var(--discord-darkest); display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 8px; flex-shrink: 0; }
        .guild-icon { width: 48px; height: 48px; border-radius: 50%; background-color: var(--discord-dark); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; color: var(--discord-text); }
        .guild-icon:hover { border-radius: 30%; background-color: var(--discord-blue); color: white; }
        .guild-icon.active { border-radius: 30%; background-color: var(--discord-blue); color: white; }
        .guild-separator { width: 32px; height: 2px; background-color: var(--discord-dark); border-radius: 1px; margin: 4px 0; }

        .channels-sidebar { width: 240px; background-color: var(--discord-sidebar); display: flex; flex-direction: column; flex-shrink: 0; }
        .server-header { height: 48px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-weight: bold; color: white; box-shadow: 0 1px 0 rgba(0,0,0,0.2); cursor: pointer; }
        .channel-list { padding: 8px; flex: 1; overflow-y: auto; }
        .channel-category { padding: 18px 8px 4px 8px; font-size: 12px; font-weight: bold; color: var(--discord-muted); text-transform: uppercase; }
        .channel-item { height: 34px; padding: 0 8px; border-radius: 4px; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: 0.2s; color: var(--discord-muted); margin-bottom: 2px; }
        .channel-item:hover { background-color: rgba(255,255,255,0.05); color: var(--discord-text); }
        .channel-item.active { background-color: rgba(255,255,255,0.1); color: white; }
        .channel-item i { font-size: 18px; opacity: 0.6; }

        .user-panel { height: 52px; background-color: #232428; padding: 0 8px; display: flex; align-items: center; gap: 8px; border-top: 1px solid rgba(255,255,255,0.05); }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; background-color: #5865f2; position: relative; }
        .user-avatar::after { content: ''; position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; border-radius: 50%; background-color: var(--discord-green); border: 2px solid #232428; }
        .user-details { flex: 1; min-width: 0; }
        .username { font-size: 14px; font-weight: bold; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-status { font-size: 12px; color: var(--discord-muted); }

        .chat-container { flex: 1; display: flex; flex-direction: column; background-color: var(--discord-dark); min-width: 0; }
        .chat-header { height: 48px; padding: 0 16px; display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 0 rgba(0,0,0,0.2); flex-shrink: 0; }
        .chat-header i { color: var(--discord-muted); font-size: 20px; }
        .chat-header h2 { font-size: 16px; color: white; }

        .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; }

        .welcome-section { margin-bottom: 24px; padding-bottom: 16px; }
        .welcome-hash { width: 68px; height: 68px; background-color: #41434a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 42px; color: white; margin-bottom: 16px; }
        .welcome-title { font-size: 32px; font-weight: 800; color: white; margin-bottom: 8px; }
        .welcome-subtitle { color: var(--discord-muted); font-size: 16px; }

        .message { display: flex; gap: 16px; padding: 2px 16px; margin-top: 1.0625rem; }
        .msg-avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px; }
        .msg-content { flex: 1; min-width: 0; }
        .msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .msg-author { font-weight: 500; color: white; }
        .msg-timestamp { font-size: 12px; color: var(--discord-muted); }
        .msg-text { color: var(--discord-text); line-height: 1.375rem; white-space: pre-wrap; word-wrap: break-word; }

        .attachment-box { margin-top: 8px; background-color: var(--discord-darker); border: 1px solid rgba(255,255,255,0.05); border-radius: 4px; padding: 12px; display: flex; align-items: center; gap: 12px; max-width: 400px; }
        .media-preview { margin-top: 8px; border-radius: 8px; overflow: hidden; max-width: 550px; border: 1px solid rgba(255,255,255,0.05); }
        .media-preview img, .media-preview video { max-width: 100%; display: block; max-height: 400px; }

        .chat-input-area { padding: 0 16px 24px 16px; flex-shrink: 0; }
        .input-wrapper { background-color: var(--discord-input); border-radius: 8px; display: flex; align-items: center; padding: 0 16px; min-height: 44px; position: relative; }
        .plus-btn { font-size: 20px; color: var(--discord-muted); cursor: pointer; margin-right: 16px; }
        .main-input { flex: 1; background: transparent; border: none; color: var(--discord-text); font-size: 16px; outline: none; padding: 11px 0; }
        .input-icons { display: flex; gap: 16px; color: var(--discord-muted); font-size: 20px; }
        .input-icons i { cursor: pointer; }
        .emoji-picker-pop { position: absolute; bottom: 60px; right: 0; z-index: 100; display: none; }
    </style>
</head>
<body>
    <div class="guilds-sidebar">
        <div class="guild-icon active"><i class="fa-brands fa-discord" style="font-size: 28px;"></i></div>
        <div class="guild-separator"></div>
        <div class="guild-icon">PS</div>
        <div class="guild-icon"><i class="fa-solid fa-plus"></i></div>
    </div>

    <div class="channels-sidebar">
        <div class="server-header">
            <span>Privat Server</span>
            <i class="fa-solid fa-chevron-down" style="font-size: 14px;"></i>
        </div>
        <div class="channel-list" id="channel-list">
            <div class="channel-category">Textkanäle</div>
            <div class="channel-item active" onclick="switchChannel('andere')"><i class="fa-solid fa-hashtag"></i> andere</div>
            <div class="channel-item" onclick="switchChannel('websiten')"><i class="fa-solid fa-hashtag"></i> websiten</div>
            <div class="channel-item" onclick="switchChannel('logos')"><i class="fa-solid fa-hashtag"></i> logos</div>
        </div>
        <div class="user-panel">
            <div class="user-avatar"></div>
            <div class="user-details">
                <div class="username">Admin</div>
                <div class="user-status">Online</div>
            </div>
            <div style="display: flex; gap: 12px; color: var(--discord-muted);">
                <i class="fa-solid fa-microphone"></i>
                <i class="fa-solid fa-headphones"></i>
                <i class="fa-solid fa-gear"></i>
            </div>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <i class="fa-solid fa-hashtag"></i>
            <h2 id="current-channel-name">andere</h2>
        </div>
        
        <div class="chat-messages" id="chat-feed">
            <div style="color: var(--discord-muted); padding: 20px;">Lade Nachrichten...</div>
        </div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <i class="fa-solid fa-circle-plus plus-btn" onclick="document.getElementById('file-input').click()"></i>
                <input type="text" class="main-input" id="chat-input" placeholder="Nachricht an #andere">
                <input type="file" id="file-input" style="display: none;" onchange="handleFileUpload(this)">
                
                <div class="input-icons">
                    <i class="fa-solid fa-face-smile" id="emoji-btn"></i>
                </div>
                <div class="emoji-picker-pop" id="emoji-picker"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin + '/api';
        const chatFeed = document.getElementById('chat-feed');
        const chatInput = document.getElementById('chat-input');
        
        let currentChannel = 'andere';

        window.onload = () => {
            refreshChat();
            setInterval(refreshChat, 3000);

            chatInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendChatMessage();
                }
            });

            const emojiBtn = document.getElementById('emoji-btn');
            const emojiPicker = document.getElementById('emoji-picker');
            const picker = picmo.createPicker({ rootElement: emojiPicker });
            
            emojiBtn.onclick = (e) => {
                e.stopPropagation();
                emojiPicker.style.display = emojiPicker.style.display === 'block' ? 'none' : 'block';
            };

            picker.addEventListener('emoji:select', (selection) => {
                chatInput.value += selection.emoji;
                emojiPicker.style.display = 'none';
                chatInput.focus();
            });

            document.onclick = () => {
                emojiPicker.style.display = 'none';
            };
        };

        function switchChannel(name) {
            currentChannel = name;
            document.getElementById('current-channel-name').innerText = name;
            document.getElementById('chat-input').placeholder = `Nachricht an #${name}`;
            
            document.querySelectorAll('.channel-item').forEach(item => {
                item.classList.remove('active');
                if (item.innerText.includes(name)) item.classList.add('active');
            });
            refreshChat();
        }

        async function refreshChat() {
            try {
                const res = await fetch(`${API_BASE_URL}/list`);
                if (!res.ok) return;
                const data = await res.json();
                
                const filtered = data.filter(item => {
                    if (item.type === 'upload') return item.content === currentChannel || (!item.content && currentChannel === 'andere');
                    return item.name === currentChannel || (!item.name && currentChannel === 'andere');
                });
                
                renderMessages(filtered);
            } catch (err) { console.error(err); }
        }

        function renderMessages(data) {
            let html = `
                <div class="welcome-section">
                    <div class="welcome-hash">#</div>
                    <h1 class="welcome-title">Willkommen bei #${currentChannel}!</h1>
                    <p class="welcome-subtitle">Das ist der Beginn des Kanals #${currentChannel}.</p>
                </div>
            `;

            data.forEach(item => {
                const ts = new Date(item.timestamp);
                const timeStr = ts.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const dateStr = ts.toLocaleDateString([], { day: '2-digit', month: '2-digit', year: 'numeric' });
                
                const headers = typeof item.headers === 'string' ? JSON.parse(item.headers) : (item.headers || {});
                const ip = headers.ip || '';
                
                let author = 'Webhook';
                let content = item.content;
                let avatarColor = '#23a559';
                let avatarInitial = 'W';

                if (item.type === 'upload') {
                    author = 'File Bot';
                    avatarColor = '#f57731';
                    avatarInitial = 'F';
                    const isImg = item.name.match(/\.(jpg|jpeg|png|gif|webp)$/i);
                    const isVid = item.name.match(/\.(mp4|webm|mov)$/i);
                    
                    content = `
                        <div class="attachment-box">
                            <i class="fa-solid fa-file-zipper" style="font-size: 24px; color: var(--discord-muted);"></i>
                            <div style="flex:1">
                                <a href="${item.path}" target="_blank" style="color: #00a8fc; text-decoration: none; font-weight: 500;">${item.name}</a>
                                <div style="font-size: 12px; color: var(--discord-muted);">${(item.size/1024).toFixed(1)} KB</div>
                            </div>
                            <a href="${item.path}" download style="color: var(--discord-muted);"><i class="fa-solid fa-download"></i></a>
                        </div>
                    `;
                    if (isImg) content += `<div class="media-preview"><img src="${item.path}"></div>`;
                    if (isVid) content += `<div class="media-preview"><video src="${item.path}" controls></video></div>`;
                } else {
                    try {
                        const parsed = JSON.parse(item.content);
                        if (parsed.type === 'chat_message') {
                            author = parsed.author || 'Admin';
                            content = parsed.content;
                            avatarColor = '#5865f2';
                            avatarInitial = author[0].toUpperCase();
                        }
                    } catch(e) {}
                }

                html += `
                    <div class="message">
                        <div class="msg-avatar" style="background-color: ${avatarColor}">${avatarInitial}</div>
                        <div class="msg-content">
                            <div class="msg-header">
                                <span class="msg-author">${author} ${ip ? `[${ip}]` : ''}</span>
                                <span class="msg-timestamp">${dateStr} ${timeStr}</span>
                            </div>
                            <div class="msg-text">${content}</div>
                        </div>
                    </div>
                `;
            });

            const shouldScroll = chatFeed.scrollTop + chatFeed.clientHeight >= chatFeed.scrollHeight - 100;
            chatFeed.innerHTML = html;
            if (shouldScroll) chatFeed.scrollTop = chatFeed.scrollHeight;
        }

        async function sendChatMessage() {
            const text = chatInput.value.trim();
            if (!text) return;
            
            const originalValue = text;
            chatInput.value = '';
            chatInput.placeholder = "Sende...";
            
            try {
                const response = await fetch(`${API_BASE_URL}/webhook`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-Channel-Id': currentChannel 
                    },
                    body: JSON.stringify({ 
                        type: 'chat_message', 
                        content: text, 
                        author: 'Admin' 
                    })
                });
                
                const result = await response.json();
                
                if (!response.ok) {
                    throw new Error(result.error || "Senden fehlgeschlagen");
                }
                
                await refreshChat();
            } catch (err) {
                console.error("Send error:", err);
                chatInput.value = originalValue;
                alert("Fehler: " + err.message);
            } finally {
                chatInput.placeholder = `Nachricht an #${currentChannel}`;
                chatInput.focus();
            }
        }

        async function handleFileUpload(input) {
            if (!input.files[0]) return;
            const file = input.files[0];
            await fetch(`${API_BASE_URL}/webhook`, {
                method: 'POST',
                headers: { 'X-File-Name': file.name, 'X-Channel-Id': currentChannel },
                body: file
            });
            refreshChat();
        }
    </script>
</body>
</html>
